{% extends 'attendance/base.html' %}

{% block title %}Log in · Attendance System{% endblock %}

{% block content %}

    <div class="card login-card">

        <h1>Log in</h1>
        <p class="subtitle">Trainers and admin staff.</p>

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <input type="hidden" name="next" value="{{ next }}">

            <button type="submit" class="btn btn-primary">
                Log in
            </button>

        </form>

    </div>

{% endblock %}
